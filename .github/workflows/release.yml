name: release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the v prefix (for example, 0.2.0)"
        required: true
        type: string
      prerelease:
        description: "Mark the GitHub release as a prerelease"
        required: true
        default: false
        type: boolean

# Read-only by default. Only `publish`, which runs no repository code, gets
# `contents: write`; `build` runs cargo (build scripts, tests) with a
# read-only token so a compromised dependency cannot push or publish.
permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Check out default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Cache cargo registry and target
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - name: Install PTY test dependency
        run: |
          sudo apt-get update
          sudo apt-get install --yes socat

      - name: Validate release request
        env:
          VERSION: ${{ inputs.version }}
        run: |
          version_pattern='^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$'
          if [[ ! "$VERSION" =~ $version_pattern ]]; then
            echo "Invalid release version: $VERSION" >&2
            exit 1
          fi

          cargo_version="$(
            cargo metadata --format-version 1 --no-deps \
              | jq -r \
                '.packages[] | select(.name == "mcp-serial-rs") | .version'
          )"
          if [[ "$VERSION" != "$cargo_version" ]]; then
            echo "Requested version $VERSION does not match" \
              "Cargo.toml version $cargo_version" >&2
            exit 1
          fi

          tag="v$VERSION"
          if git rev-parse --verify --quiet "refs/tags/$tag"; then
            echo "Tag $tag already exists" >&2
            exit 1
          fi

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: Test
        run: cargo test --locked --all-targets

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package release assets
        env:
          VERSION: ${{ inputs.version }}
        run: |
          asset="mcp-serial-rs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          staging="mcp-serial-rs-v${VERSION}-x86_64-unknown-linux-gnu"

          mkdir "$staging"
          cp target/release/mcp-serial-rs \
            README.md LICENSE-MIT LICENSE-APACHE "$staging/"
          mkdir dist
          tar -czf "dist/$asset" "$staging"
          (cd dist && sha256sum "$asset" > "${asset}.sha256")

      - name: Verify packaged binary version
        env:
          VERSION: ${{ inputs.version }}
        run: |
          output="$(target/release/mcp-serial-rs --version)"
          if [[ "$output" != "mcp-serial-rs $VERSION" ]]; then
            echo "Unexpected binary version: $output" >&2
            exit 1
          fi

      - name: Generate release notes
        # v4
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff
        with:
          version: v2.13.1
          config: cliff.toml
          args: --unreleased --tag v${{ inputs.version }} --strip header
        env:
          OUTPUT: RELEASE_NOTES.md
          GITHUB_REPO: ${{ github.repository }}

      - name: Upload release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-payload
          path: |
            dist/
            RELEASE_NOTES.md
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download release payload
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-payload

      - name: Create tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          asset="dist/mcp-serial-rs-v${VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          (cd dist && sha256sum --check --strict -- *.sha256)
          args=(
            "v$VERSION"
            "$asset"
            "${asset}.sha256"
            --repo "$GITHUB_REPOSITORY"
            --target "$GITHUB_SHA"
            --title "mcp-serial-rs $VERSION"
            --notes-file RELEASE_NOTES.md
          )
          if [[ "$PRERELEASE" == "true" ]]; then
            args+=(--prerelease)
          fi
          gh release create "${args[@]}"

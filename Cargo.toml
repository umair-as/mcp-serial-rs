[package]
name = "mcp-serial-rs"
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "MCP server exposing serial-port access (open/read/write/exec/close) over stdio, with per-port async sessions."
repository = "https://github.com/umair-as/mcp-serial-rs"
readme = "README.md"
# MSRV follows rmcp: 1.75 → 1.85 for the edition-2024 chain behind
# rmcp 1.x, then → 1.88 for rmcp 3.x (MCP 2026-07-28).
rust-version = "1.88"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-serial = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
regex = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
getrandom = "0.4"
tokio-util = "0.7"
libc = "0.2"
# MCP protocol layer. Default features already include `macros` (for
# #[tool], #[tool_router], #[tool_handler]) and `server`; we additionally
# enable `transport-io` for the stdio transport.
rmcp = { version = "3.5", features = ["transport-io"] }
schemars = "1.0"

[dev-dependencies]
tokio-test = "0.4"
assert_matches = "1"
tempfile = "3"
jsonschema = { version = "0.52", default-features = false }
